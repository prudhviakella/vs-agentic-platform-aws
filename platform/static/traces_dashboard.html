<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentCore Observability</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:'AppleGothic','Apple Gothic','Gill Sans MT','Century Gothic','Trebuchet MS',ui-rounded,sans-serif;
  --mono:'Menlo','Courier New',monospace;
  --bg:#07111e;--surface:#0d1928;--surface-2:#112030;--surface-3:#152638;
  --border:#1a2e44;--border-2:#1f3550;
  --accent:#00c2ff;--accent-dim:rgba(0,194,255,0.12);--accent-glow:rgba(0,194,255,0.05);
  --green:#00e5a0;--green-dim:rgba(0,229,160,0.12);
  --red:#ff4d6a;--red-dim:rgba(255,77,106,0.12);
  --amber:#ffb340;--amber-dim:rgba(255,179,64,0.12);
  --purple:#c084fc;--purple-dim:rgba(192,132,252,0.12);
  --text:#cddff0;--text-2:#6b8fae;--text-3:#2e4a63;
  --r:8px;--r-lg:14px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:13px}
.shell{display:grid;grid-template-rows:58px 1fr;height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:28px;height:28px;background:linear-gradient(135deg,#00c2ff,#005fff);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px}
.brand-name{font-size:14px;font-weight:500}
.brand-sub{font-size:11px;color:var(--text-2);margin-left:4px}
.header-actions{display:flex;gap:8px;align-items:center}
.pill{font-size:11px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);padding:3px 10px;border-radius:20px;letter-spacing:.02em;cursor:pointer;transition:.15s}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.active{color:var(--green);border-color:rgba(0,229,160,.3);background:var(--green-dim)}
.refresh-btn{background:var(--accent-dim);border:1px solid rgba(0,194,255,.3);color:var(--accent);padding:5px 14px;border-radius:var(--r);font-family:var(--font);font-size:12px;cursor:pointer;transition:.15s}
.refresh-btn:hover{background:rgba(0,194,255,.2)}
.last-updated{font-size:10px;color:var(--text-3)}
.main{overflow:hidden}
.content{height:100%;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:20px}
.content::-webkit-scrollbar{width:3px}
.content::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:2px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.card.blue::before{background:var(--accent)}.card.green::before{background:var(--green)}
.card.amber::before{background:var(--amber)}.card.red::before{background:var(--red)}
.card.purple::before{background:var(--purple)}
.card-label{font-size:10px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase}
.card-value{font-size:26px;font-weight:500;letter-spacing:-.02em}
.card-value.blue{color:var(--accent)}.card-value.green{color:var(--green)}
.card-value.amber{color:var(--amber)}.card-value.red{color:var(--red)}.card-value.purple{color:var(--purple)}
.card-sub{font-size:11px;color:var(--text-2)}
.charts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.chart-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
.chart-title{font-size:11px;color:var(--text-2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:80px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.bar{width:100%;border-radius:3px 3px 0 0;transition:.3s;min-height:2px;position:relative;cursor:default}
.bar:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--border-2);color:var(--text);padding:3px 8px;border-radius:5px;font-size:10px;white-space:nowrap;z-index:10}
.bar-label{font-size:9px;color:var(--text-3)}
.donut-wrap{display:flex;align-items:center;gap:16px}
.legend{display:flex;flex-direction:column;gap:6px;flex:1}
.legend-item{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-2)}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-val{margin-left:auto;color:var(--text);font-weight:500}
.table-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.table-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.table-title{font-size:11px;color:var(--text-2);letter-spacing:.06em;text-transform:uppercase}
.table-filters{display:flex;gap:8px}
.filter-btn{font-size:11px;font-family:var(--font);background:none;border:1px solid var(--border);color:var(--text-2);padding:3px 10px;border-radius:20px;cursor:pointer;transition:.15s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
table{width:100%;border-collapse:collapse}
th{font-size:10px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;text-align:left;border-bottom:1px solid var(--border);font-weight:400;background:var(--surface-2)}
td{padding:10px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr{cursor:pointer;transition:.12s}
tr:hover td{background:var(--accent-glow)}
tr.selected td{background:var(--accent-dim)}
.q-cell{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.run-id{font-family:var(--mono);font-size:10px;color:var(--text-3)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500}
.badge.green{color:var(--green);background:var(--green-dim);border:1px solid rgba(0,229,160,.2)}
.badge.red{color:var(--red);background:var(--red-dim);border:1px solid rgba(255,77,106,.2)}
.badge.amber{color:var(--amber);background:var(--amber-dim);border:1px solid rgba(255,179,64,.2)}
.badge.blue{color:var(--accent);background:var(--accent-dim);border:1px solid rgba(0,194,255,.2)}
.badge.purple{color:var(--purple);background:var(--purple-dim);border:1px solid rgba(192,132,252,.2)}
.tools-cell{display:flex;gap:4px;flex-wrap:wrap}
.tool-tag{font-size:9px;font-family:var(--mono);background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);padding:1px 6px;border-radius:4px}
.detail-overlay{position:fixed;inset:0;background:rgba(7,17,30,.7);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-end;justify-content:flex-end}
.detail-overlay.open{display:flex}
.detail-panel{width:560px;height:100vh;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.detail-panel::-webkit-scrollbar{width:3px}
.detail-panel::-webkit-scrollbar-thumb{background:var(--border-2)}
.detail-top{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:1}
.detail-top-title{font-size:13px;font-weight:500}
.close-btn{background:none;border:1px solid var(--border);color:var(--text-2);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.15s}
.close-btn:hover{border-color:var(--accent);color:var(--accent)}
.detail-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.detail-section{border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.ds-title{font-size:10px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.ds-body{padding:12px}
.kv-grid{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;align-items:baseline}
.kv-key{font-size:11px;color:var(--text-2);white-space:nowrap}
.kv-val{font-size:12px;color:var(--text);word-break:break-word}
.kv-val.mono{font-family:var(--mono);font-size:10px;color:var(--accent)}
.q-text{font-size:13px;color:var(--text);line-height:1.7;background:var(--surface-2);border-radius:var(--r);padding:12px}
.answer-text{font-size:12px;color:var(--text);line-height:1.8;max-height:220px;overflow-y:auto;white-space:pre-wrap}
.answer-text::-webkit-scrollbar{width:2px}
.answer-text::-webkit-scrollbar-thumb{background:var(--border-2)}
.tool-call{background:var(--surface-2);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.tool-call:last-child{margin-bottom:0}
.tool-name{font-size:11px;font-weight:500;color:var(--accent);margin-bottom:4px;font-family:var(--mono)}
.tool-args{font-size:10px;color:var(--text-2);font-family:var(--mono);margin-bottom:4px}
.tool-result{font-size:10px;color:var(--text-3);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timing-row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border)}
.timing-row:last-child{border-bottom:none}
.t-turn{font-size:10px;color:var(--text-3);width:40px}
.t-bar-wrap{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.t-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),#005fff)}
.t-ms{font-size:10px;color:var(--text-2);width:55px;text-align:right}
.t-tok{font-size:10px;color:var(--text-3);width:65px;text-align:right}
.hitl-box{background:var(--amber-dim);border:1px solid rgba(255,179,64,.3);border-radius:var(--r);padding:12px}
.hitl-q{font-size:12px;color:var(--amber);margin-bottom:8px}
.hitl-opt{font-size:11px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:5px 10px;margin-bottom:4px}
.hitl-opt.selected{border-color:var(--amber);color:var(--amber)}
.score-row{display:flex;align-items:center;gap:10px;padding:4px 0}
.score-label{font-size:11px;color:var(--text-2);width:120px}
.score-track{flex:1;height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.score-fill{height:100%;border-radius:3px}
.score-val{font-size:11px;width:32px;text-align:right;font-weight:500}
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text-3);gap:10px;font-size:13px}
.spin{width:16px;height:16px;border:2px solid var(--border-2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:var(--text-3)}
.err-banner{padding:12px 16px;background:var(--red-dim);border:1px solid rgba(255,77,106,.3);border-radius:var(--r);color:var(--red);font-size:12px}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <div class="brand-icon">📊</div>
      <span class="brand-name">AgentCore Observability</span>
      <span class="brand-sub">/ traces</span>
    </div>
    <div class="header-actions">
      <span class="last-updated" id="last-updated"></span>
      <span class="pill active" id="live-pill">● live</span>
      <button class="refresh-btn" onclick="loadTraces()">↻ Refresh</button>
    </div>
  </header>

  <div class="main">
    <div class="content">

      <div id="err-area"></div>

      <div class="cards">
        <div class="card blue">
          <div class="card-label">Total Queries</div>
          <div class="card-value blue" id="c-total">—</div>
          <div class="card-sub" id="c-total-sub">—</div>
        </div>
        <div class="card green">
          <div class="card-label">Total Cost</div>
          <div class="card-value green" id="c-cost">—</div>
          <div class="card-sub" id="c-cost-sub">—</div>
        </div>
        <div class="card amber">
          <div class="card-label">Avg Latency</div>
          <div class="card-value amber" id="c-latency">—</div>
          <div class="card-sub" id="c-latency-sub">—</div>
        </div>
        <div class="card purple">
          <div class="card-label">Cache Hit Rate</div>
          <div class="card-value purple" id="c-cache">—</div>
          <div class="card-sub" id="c-cache-sub">—</div>
        </div>
        <div class="card red">
          <div class="card-label">HITL Fire Rate</div>
          <div class="card-value red" id="c-hitl">—</div>
          <div class="card-sub" id="c-hitl-sub">—</div>
        </div>
      </div>

      <div class="charts">
        <div class="chart-box">
          <div class="chart-title">Queries per Day (last 7d)</div>
          <div class="bar-chart" id="chart-queries"></div>
        </div>
        <div class="chart-box">
          <div class="chart-title">Tool Usage</div>
          <div class="donut-wrap">
            <canvas id="chart-tools" width="90" height="90"></canvas>
            <div class="legend" id="tools-legend"></div>
          </div>
        </div>
        <div class="chart-box">
          <div class="chart-title">Cost per Day $ (last 7d)</div>
          <div class="bar-chart" id="chart-cost"></div>
        </div>
      </div>

      <div class="table-box">
        <div class="table-header">
          <div class="table-title">Traces  <span id="trace-count" style="color:var(--text-3);font-weight:normal"></span></div>
          <div class="table-filters">
            <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
            <button class="filter-btn" onclick="setFilter('hitl',this)">HITL</button>
            <button class="filter-btn" onclick="setFilter('cache',this)">Cache hits</button>
            <button class="filter-btn" onclick="setFilter('errors',this)">Errors</button>
            <button class="filter-btn" onclick="setFilter('blocked',this)">Blocked</button>
          </div>
        </div>
        <div id="table-wrap">
          <div class="loading"><div class="spin"></div>Loading traces from DynamoDB…</div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="detail-overlay" id="overlay" onclick="closeDetail(event)">
  <div class="detail-panel">
    <div class="detail-top">
      <div class="detail-top-title">Trace Detail</div>
      <button class="close-btn" onclick="closeDetail()">×</button>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </div>
</div>

<script>
let allTraces = [];
let filter    = 'all';
let selected  = null;

async function loadTraces() {
  try {
    const res = await fetch('/api/v1/clinical-trial/traces', {
      headers: { 'X-API-Key': window.PLATFORM_API_KEY || '' }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    allTraces = await res.json();
    document.getElementById('err-area').innerHTML = '';
    document.getElementById('last-updated').textContent =
      'Updated ' + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('err-area').innerHTML =
      `<div class="err-banner">⚠ Failed to load traces: ${e.message}</div>`;
    return;
  }
  renderAll();
}

function renderAll() {
  renderCards();
  renderChartQueries();
  renderChartTools();
  renderChartCost();
  renderTable();
}

function renderCards() {
  const t = allTraces;
  if (!t.length) return;
  const total     = t.length;
  const totalCost = t.reduce((s,r) => s + parseFloat(r.token_cost_usd||0), 0);
  const lats      = t.map(r => parseFloat(r.elapsed_ms||0));
  const avgLat    = lats.reduce((s,v)=>s+v,0) / total;
  const medLat    = median(lats);
  const cacheHits = t.filter(r => r.cache_hit).length;
  const hitlFired = t.filter(r => r.hitl_fired).length;
  const errors    = t.filter(r => r.has_errors).length;

  set('c-total',     total);
  set('c-total-sub', `${total - errors} successful · ${errors} errors`);
  set('c-cost',      `$${totalCost.toFixed(4)}`);
  set('c-cost-sub',  `avg $${(totalCost/total).toFixed(4)} / query`);
  set('c-latency',   `${(avgLat/1000).toFixed(1)}s`);
  set('c-latency-sub', `median ${(medLat/1000).toFixed(1)}s`);
  set('c-cache',     `${Math.round(cacheHits/total*100)}%`);
  set('c-cache-sub', `${cacheHits} of ${total} queries`);
  set('c-hitl',      `${Math.round(hitlFired/total*100)}%`);
  set('c-hitl-sub',  `${hitlFired} interrupts`);
}

function median(arr) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a,b)=>a-b);
  const m = Math.floor(s.length/2);
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
}

function renderChartQueries() {
  const days = lastNDays(7);
  allTraces.forEach(r => {
    const d = tsToDate(r.ts);
    if (d in days) days[d]++;
  });
  drawBars('chart-queries', days, '#00c2ff',
    (k,v) => `${k}: ${v} quer${v===1?'y':'ies'}`);
}

function renderChartCost() {
  const days = lastNDays(7);
  allTraces.forEach(r => {
    const d = tsToDate(r.ts);
    if (d in days) days[d] += parseFloat(r.token_cost_usd||0);
  });
  drawBars('chart-cost', days, '#ffb340',
    (k,v) => `${k}: $${v.toFixed(4)}`);
}

function drawBars(id, daysObj, color, tipFn) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '';
  const keys = Object.keys(daysObj);
  const vals = Object.values(daysObj);
  const max  = Math.max(...vals, 0.0001);
  keys.forEach((k,i) => {
    const pct = Math.round((vals[i]/max)*100);
    const w = document.createElement('div');
    w.className = 'bar-wrap';
    w.innerHTML =
      `<div class="bar" style="background:${color};opacity:.8;height:${pct}%;width:100%" ` +
      `data-tip="${tipFn(k,vals[i])}"></div>` +
      `<div class="bar-label">${k.slice(5)}</div>`;
    el.appendChild(w);
  });
}

function renderChartTools() {
  const counts = {};
  allTraces.forEach(r => {
    (r.tools||[]).forEach(t => {
      let name = t.split('___')[0].replace('tool-','');
      counts[name] = (counts[name]||0) + 1;
    });
  });
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const total   = entries.reduce((s,[,v])=>s+v,0)||1;
  const colors  = ['#00c2ff','#00e5a0','#ffb340','#ff4d6a','#c084fc'];

  const c = document.getElementById('chart-tools');
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,90,90);
  let start = -Math.PI/2;
  entries.forEach(([,v],i) => {
    const angle = (v/total)*2*Math.PI;
    ctx.beginPath();
    ctx.arc(45,45,36,start,start+angle);
    ctx.arc(45,45,20,start+angle,start,true);
    ctx.closePath();
    ctx.fillStyle = colors[i];
    ctx.globalAlpha = .9;
    ctx.fill();
    start += angle;
  });

  const leg = document.getElementById('tools-legend');
  leg.innerHTML = entries.map(([name,v],i) =>
    `<div class="legend-item">
       <div class="legend-dot" style="background:${colors[i]}"></div>
       <span>${name}</span>
       <span class="legend-val">${v}</span>
     </div>`
  ).join('');
}

function renderTable() {
  let rows = allTraces;
  if (filter === 'hitl')    rows = rows.filter(r => r.hitl_fired);
  if (filter === 'cache')   rows = rows.filter(r => r.cache_hit);
  if (filter === 'errors')  rows = rows.filter(r => r.has_errors);
  if (filter === 'blocked') rows = rows.filter(r => r.guardrail_blocked);

  set('trace-count', `(${rows.length})`);

  const wrap = document.getElementById('table-wrap');
  if (!rows.length) {
    wrap.innerHTML = '<div class="empty">No traces match this filter</div>';
    return;
  }
  wrap.innerHTML = `<table>
    <thead><tr>
      <th>Run ID</th><th>Question</th><th>Tools</th>
      <th>Tokens</th><th>Cost</th><th>Latency</th>
      <th>HITL</th><th>Guardrail</th>
    </tr></thead>
    <tbody>
    ${rows.map(r => `
      <tr onclick="openDetail('${r.run_id}')" class="${selected===r.run_id?'selected':''}">
        <td><span class="run-id">${(r.run_id||'').slice(0,8)}…</span></td>
        <td><div class="q-cell">${esc(trimQ(r.question||''))}</div></td>
        <td><div class="tools-cell">${(r.tools||[]).slice(0,3).map(t=>
          `<span class="tool-tag">${t.split('___')[0].replace('tool-','')}</span>`).join('')}
        </div></td>
        <td>${r.total_tokens||0}</td>
        <td>$${parseFloat(r.token_cost_usd||0).toFixed(4)}</td>
        <td>${(parseFloat(r.elapsed_ms||0)/1000).toFixed(1)}s</td>
        <td>${r.hitl_fired
          ? `<span class="badge amber">HITL</span>`
          : `<span class="badge blue">—</span>`}</td>
        <td>${r.guardrail_blocked
          ? `<span class="badge red">blocked</span>`
          : `<span class="badge green">passed</span>`}</td>
      </tr>`).join('')}
    </tbody></table>`;
}

function trimQ(q) {
  // Strip the [HITL Answer]: prefix
  return q.replace(/^\[HITL Answer\]:\s*/,'').trim();
}

function openDetail(runId) {
  selected = runId;
  renderTable();
  const r = allTraces.find(t => t.run_id === runId);
  if (!r) return;

  const timings = r.llm_timings || [];
  const maxMs   = Math.max(...timings.map(t=>t.elapsed_ms||1), 1);
  const faith   = parseFloat(r.faithfulness_score||0);
  const cons    = parseFloat(r.consistency_score||0);

  document.getElementById('detail-body').innerHTML = `

    <div class="detail-section">
      <div class="ds-title">Run Info</div>
      <div class="ds-body"><div class="kv-grid">
        <span class="kv-key">Run ID</span>     <span class="kv-val mono">${r.run_id||'—'}</span>
        <span class="kv-key">Prompt v</span>    <span class="kv-val">${r.prompt_version||'—'}</span>
        <span class="kv-key">Domain</span>      <span class="kv-val">${r.domain||'—'}</span>
        <span class="kv-key">LLM turns</span>   <span class="kv-val">${r.llm_turns||'—'}</span>
        <span class="kv-key">Tool calls</span>  <span class="kv-val">${r.tool_count||0}</span>
        <span class="kv-key">Elapsed</span>     <span class="kv-val">${(parseFloat(r.elapsed_ms||0)/1000).toFixed(2)}s</span>
        <span class="kv-key">Tokens</span>      <span class="kv-val">${r.input_tokens||0} in / ${r.output_tokens||0} out</span>
        <span class="kv-key">Cost</span>        <span class="kv-val" style="color:var(--green)">$${parseFloat(r.token_cost_usd||0).toFixed(5)}</span>
        <span class="kv-key">Cache hit</span>   <span class="kv-val">${r.cache_hit
          ? '<span class="badge green">yes</span>'
          : '<span class="badge blue">no</span>'}</span>
        <span class="kv-key">Episodic hits</span><span class="kv-val">${r.episodic_hits||0}</span>
        <span class="kv-key">Is resume</span>   <span class="kv-val">${r.is_resume?'yes':'no'}</span>
      </div></div>
    </div>

    <div class="detail-section">
      <div class="ds-title">Question</div>
      <div class="ds-body"><div class="q-text">${esc(trimQ(r.question||''))}</div></div>
    </div>

    <div class="detail-section">
      <div class="ds-title">Answer</div>
      <div class="ds-body"><div class="answer-text">${esc(r.answer||'')}</div></div>
    </div>

    ${(r.tool_details||[]).length ? `
    <div class="detail-section">
      <div class="ds-title">Tool Calls (${(r.tool_details||[]).length})</div>
      <div class="ds-body">
        ${(r.tool_details||[]).map(t=>`
          <div class="tool-call">
            <div class="tool-name">${esc(t.name||'')}</div>
            <div class="tool-args">args: ${esc((t.args_summary||'').slice(0,150))}</div>
            <div class="tool-result" style="${t.is_error?'color:var(--red)':''}">
              ${t.is_error?'⚠ ':'→ '}${esc((t.result_summary||'').slice(0,200))}
            </div>
          </div>`).join('')}
      </div>
    </div>` : ''}

    ${timings.length ? `
    <div class="detail-section">
      <div class="ds-title">LLM Timings per Turn</div>
      <div class="ds-body">
        ${timings.map(t=>`
          <div class="timing-row">
            <span class="t-turn">Turn ${t.turn}</span>
            <div class="t-bar-wrap">
              <div class="t-bar" style="width:${Math.round((t.elapsed_ms||0)/maxMs*100)}%"></div>
            </div>
            <span class="t-ms">${((t.elapsed_ms||0)/1000).toFixed(2)}s</span>
            <span class="t-tok">${t.input_tokens||0}+${t.output_tokens||0}</span>
          </div>`).join('')}
      </div>
    </div>` : ''}

    ${r.hitl_fired ? `
    <div class="detail-section">
      <div class="ds-title">HITL Interrupt</div>
      <div class="ds-body">
        <div class="hitl-box">
          <div class="hitl-q">${esc(r.hitl_question||'')}</div>
          <div>
            ${(r.hitl_options||[]).map(o=>
              `<div class="hitl-opt ${o===r.hitl_user_answer?'selected':''}">${esc(o)}</div>`
            ).join('')}
          </div>
          ${r.hitl_user_answer?`<div style="margin-top:8px;font-size:11px;color:var(--amber)">
            ✓ Selected: ${esc(r.hitl_user_answer)}</div>`:''}
        </div>
      </div>
    </div>` : ''}

    <div class="detail-section">
      <div class="ds-title">Guardrail Scores</div>
      <div class="ds-body">
        <div class="score-row">
          <span class="score-label">Faithfulness</span>
          <div class="score-track">
            <div class="score-fill" style="width:${faith*100}%;background:${faith>=0.7?'var(--green)':'var(--red)'}"></div>
          </div>
          <span class="score-val" style="color:${faith>=0.7?'var(--green)':'var(--red)'}">${faith.toFixed(2)}</span>
        </div>
        <div class="score-row">
          <span class="score-label">Consistency</span>
          <div class="score-track">
            <div class="score-fill" style="width:${cons*100}%;background:${cons>=0.7?'var(--green)':'var(--red)'}"></div>
          </div>
          <span class="score-val" style="color:${cons>=0.7?'var(--green)':'var(--red)'}">${cons.toFixed(2)}</span>
        </div>
        <div style="margin-top:8px">
          ${r.guardrail_blocked
            ? '<span class="badge red">⚠ Response blocked by guardrail</span>'
            : '<span class="badge green">✓ Guardrail passed</span>'}
        </div>
      </div>
    </div>`;

  document.getElementById('overlay').classList.add('open');
}

function closeDetail(e) {
  if (e && e.target !== document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.remove('open');
  selected = null;
  renderTable();
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function set(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function tsToDate(ts) {
  return new Date(parseFloat(ts||0)*1000).toISOString().slice(0,10);
}
function lastNDays(n) {
  const d = {};
  for (let i=n-1; i>=0; i--) {
    const dt = new Date(); dt.setDate(dt.getDate()-i);
    d[dt.toISOString().slice(0,10)] = 0;
  }
  return d;
}

// Boot + auto-refresh every 30s
loadTraces();
setInterval(loadTraces, 30000);
</script>
</body>
</html>
